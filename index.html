<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="dispSec">
            <h1 id="display">0</h1>
        </section>
        <section class="memFunSec">
            <button>MC</button><button>MR</button><button>M+</button><button>M-</button><button>MS</button><button>M\/</button>
        </section>
        <div class="btnRow">
            <button>%</button><button id="clearCurrentNum">CE</button><button id="clearAll">C</button><button id="backspace"><--</button><br>
        </div>
        <div class="btnRow">
            <button><sup>1</sup>/<sub>x</sub></button><button id="square">x<sup>2</sup></button><button id="sqrt">\/x</button><button class="operation">/</button><br>
        </div>
        <div class="btnRow">
            <button class="num">7</button><button class="num">8</button><button class="num">9</button><button class="operation">X</button><br>
        </div>
        <div class="btnRow">
            <button class="num">4</button><button class="num">5</button><button class="num">6</button><button class="operation">-</button><br>
        </div>
        <div class="btnRow">
            <button class="num">1</button><button class="num">2</button><button class="num">3</button><button class="operation">+</button><br>
        </div>
        <div class="btnRow">
            <button><sup>+</sup>/<sub>-</sub></button><button class="num">0</button><button id="dot">.</button><button class="operation">=</button><br>
        </div>
    </main>
</body>
<script src="app.js"></script>
</html>
